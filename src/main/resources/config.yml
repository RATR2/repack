# Logs what happens when players click and mine custom blocks, to find out why something does not work.
debug: false

# Install the table that comes with Repack (models/table.bbmodel and blocks/table.yml) the first time it runs.
install-defaults: true

# Write a settings file in blocks/ (every option, at its default) for each model that does not have one yet.
create-block-files: true

# Sent in chat when a protection plugin such as WorldGuard says no. Leave empty for no message.
messages:
  no-permission: "You can't do that here."

resource-pack:
  # Address players' clients download the pack from: your server's public IP or domain.
  # Empty uses server-ip from server.properties, or localhost if that is empty too.
  public-host: ""
  # Port of the pack's built-in HTTP server; it must be reachable by players.
  # Change it and run /repack reload host, no restart needed.
  port: 8086
  bind: 0.0.0.0
  # Share one pack server with Distortion (or any other plugin using this scheme). Whichever plugin starts first hosts it and
  # decides the address and port; the others serve under it and ignore their own public-host and port while they do.
  share-host: true
  # Wait this long after a player joins before sending the pack, so it does not arrive with everything else (20 ticks = 1 second).
  join-delay-ticks: 40
  # Minimum time between two packs reaching the same player from plugins that share the server.
  send-gap-ticks: 20
  # A player who joins gets the newest build, even one that was never pushed. false: only the pack that was last pushed.
  join-latest-build: true
  # While a player's client reloads a pack you sent them (from "downloaded" until "loaded", at most 20 seconds) they are held: they cannot be
  # hurt, move, attack or interact, see no other entities, and every block around them, air included, is shown as black concrete (except the two they stand in). It does not start
  # again for two minutes, and a client that fakes its status gains almost nothing.
  invulnerable-while-loading: true
  black-blocks-while-loading: true
  # How far around the player the blocks are blacked out, up to 16.
  loading-radius: 8
  # Kick players who decline the pack.
  required: false
  prompt: "This server uses a resource pack for custom blocks and effects."

# Tell players when their client version is too old for the blocks.
client-notices: true

# The console says so when the server runs a version older than 26.3, where the ripple effects need Fabulous! graphics. false: say nothing.
recommend-latest: true

# Distortion, now part of Repack: ripple effects anchored in the world, made by the pack's shaders. false: no shaders in the pack and no ripples.
# Change it and restart the server; the pack changes at the next /repack build.
distortion:
  enabled: true

# Animated text (r4tshader, built into Repack). Text drawn in an effect's trigger color is painted by the pack's text shader as a moving gradient
# instead: chat, signs, item names, anything. Use the color directly (&#ff0cff or <#ff0cff>) or the name: <fx:pink> in an item name or lore is its trigger.
# Works for 1.21.6 and newer clients; the pack changes at the next /repack build. enabled: false removes it from the pack.
text-effects:
  enabled: true
  # Used by any effect that does not set the same key itself.
  defaults:
    speed: 300.0          # cycles per Minecraft day (about a 4 second sweep)
    frequency: 0.10       # how tightly the wave repeats along the text
    bias: 0.42            # 0 splits evenly, higher is brighter, lower is darker
    hot-exponent: 5.0     # sharpness of the bright peak
    hot-strength: 0.12    # strength of the bright peak
  # name:
  #   trigger: "#ff0cff"  # the text color that starts it (quote colors: # starts a YAML comment)
  #   from: "#ff0cff"     # gradient base, the dark end (not used by rainbow)
  #   to: "#ff70ff"       # gradient peak, the bright end (not used by rainbow)
  #   type: shine         # sweep (same as shine), pulse, wave, strobe or rainbow
  #   shadow: match       # match, or legacy: guesses the drop shadow from how dark the color is
  #   speed / frequency / bias / hot-exponent / hot-strength: as in defaults
  #   offset: 0.0         # head start in cycles, so effects do not move together
  effects:
    pink:
      trigger: "#ff0cff"
      from: "#ff0cff"
      to: "#ff70ff"
      type: shine
      speed: 325.0
    teal:
      trigger: "#0e5e6e"
      from: "#0e5e6e"
      to: "#02bbde"
      type: shine
      speed: 200.0

workflow:
  # Rebuild the pack when a model or block file changes, a few seconds after the last save. This is silent: nobody online is sent anything.
  # /repack reload builds and pushes the pack to everyone online, and /repack push [player] pushes the pack that was built.
  build-on-change: true
  # Show operators (repack.admin) a boss bar with the progress while the pack builds.
  progress-bar: true

gui:
  # Use the pictures for the builder screens when the plugin has them. false: plain chest titles and vanilla items.
  textures: true
