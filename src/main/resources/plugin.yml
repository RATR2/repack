name: repack
version: '${version}'

main: io.github.ratr2.repack.Repack
api-version: '1.21'
load: POSTWORLD
depend: [packetevents]
softdepend: [WorldGuard, ViaVersion, ViaBackwards, Skript]

# /repack itself is registered with Brigadier in Repack.onEnable.
permissions:
  repack.admin:
    description: Allows /repack build, push and status.
    default: op
